
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster AI Chess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 4px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .square.light { background-color: #e2e8f0; color: #1e293b; }
        .square.dark { background-color: #64748b; color: #f1f5f9; }
        .square.selected { background-color: #fbbf24 !important; }
        .square.valid-move::after {
            content: '';
            width: 25%;
            height: 25%;
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
        }
        .square.capture-move::after {
            content: '';
            width: 80%;
            height: 80%;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            position: absolute;
        }
        .piece {
            z-index: 10;
            user-select: none;
            transition: transform 0.1s ease;
        }
        .piece:hover { transform: scale(1.1); }
        @media (max-width: 640px) {
            .square { font-size: 1.8rem; }
        }
    </style>
<script type="importmap">

    "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
  }
}
</script>
</head>

</body>
</html>
